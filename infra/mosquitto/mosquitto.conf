# TLS listener. The entrypoint copies this file and, only when
# MQTT_ALLOW_PLAINTEXT=true, appends a plaintext listener on 1883.
# Do not set `user` here: the process already runs as the mosquitto user.

per_listener_settings true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
tls_version tlsv1.2
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
